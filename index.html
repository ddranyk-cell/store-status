<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Статус Ресторанів KFC</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000);
      padding: 10px;
      margin: 0;
      box-sizing: border-box;
      font-size: 13px;
    }
    .header-card {
      background: #2563eb;
      color: white;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .select-resto {
      width: 100%;
      padding: 6px 8px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      margin-bottom: 6px;
      background: #ffffff;
      color: #1e293b;
    }
    .header-info { font-size: 11px; opacity: 0.95; line-height: 1.3; }
    .header-info a { color: #ffffff; text-decoration: underline; font-weight: 600; }
    
    .section {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .section-title { font-weight: bold; margin-bottom: 6px; font-size: 10px; color: #6b7280; text-transform: uppercase; }
    
    .btn-group { display: flex; gap: 4px; }
    .btn-option {
      flex: 1; padding: 6px 2px; border: 1px solid #e5e7eb; border-radius: 6px;
      background: #f9fafb; color: #374151; font-weight: 600; font-size: 11px; cursor: pointer; text-align: center;
    }
    .btn-option.active-green { background: #22c55e; color: #fff; border-color: #22c55e; }
    .btn-option.active-red { background: #ef4444; color: #fff; border-color: #ef4444; }
    .btn-option.active-orange { background: #f97316; color: #fff; border-color: #f97316; }
    .btn-option.active-blue { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    
    .channels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }
    .channel-item { display: flex; justify-content: space-between; align-items: center; }
    .channel-item span { font-size: 12px; font-weight: 500; }

    .toggle-row-vert { margin-bottom: 6px; }
    .toggle-row-vert:last-child { margin-bottom: 0; }
    .toggle-row-vert span { font-size: 11px; font-weight: 600; display: block; margin-bottom: 3px; color: #4b5563; }

    .comment-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    
    .submit-btn {
      width: 100%; padding: 10px; background: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 8px;
      font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <select id="restoSelect" class="select-resto" onchange="onRestaurantChange()"></select>
    <div class="header-info">
      <div>📞 <b>Тел:</b> <span id="info-phone">-</span></div>
      <div>👤 <b>Директор:</b> <span id="info-director">-</span></div>
      <div>👔 <b>ТК:</b> <span id="info-tk">-</span></div>
    </div>
  </div>

  <!-- 1. Загальний статус -->
  <div class="section">
    <div class="section-title">1. Загальний статус</div>
    <div class="btn-group" id="main-status-group">
      <div class="btn-option" id="btn-main-open" onclick="selectMainStatus('Відчинені')">Відчинені</div>
      <div class="btn-option" id="btn-main-closed" onclick="selectMainStatus('Зачинені')">Зачинені</div>
      <div class="btn-option" id="btn-main-shelter" onclick="selectMainStatus('Зачинені + в укритті')">Зачинені + укриття</div>
    </div>
  </div>

  <!-- 2. Канали продажів (компактна сітка 2х2) -->
  <div class="section">
    <div class="section-title">2. Канали продажів</div>
    <div class="channels-grid">
      <div class="channel-item">
        <span>Зал</span>
        <div class="btn-group" id="group-hall" style="width: 80px;">
          <button class="btn-option" onclick="toggleBtn('hall', 'Працює')">Так</button>
          <button class="btn-option" onclick="toggleBtn('hall', 'Ні')">Ні</button>
        </div>
      </div>
      <div class="channel-item">
        <span>Драйв</span>
        <div class="btn-group" id="group-drive" style="width: 80px;">
          <button class="btn-option" onclick="toggleBtn('drive', 'Працює')">Так</button>
          <button class="btn-option" onclick="toggleBtn('drive', 'Ні')">Ні</button>
        </div>
      </div>
      <div class="channel-item">
        <span>Доставка</span>
        <div class="btn-group" id="group-delivery" style="width: 80px;">
          <button class="btn-option" onclick="toggleBtn('delivery', 'Працює')">Так</button>
          <button class="btn-option" onclick="toggleBtn('delivery', 'Ні')">Ні</button>
        </div>
      </div>
      <div class="channel-item">
        <span>C&C</span>
        <div class="btn-group" id="group-pickup" style="width: 80px;">
          <button class="btn-option" onclick="toggleBtn('pickup', 'Працює')">Так</button>
          <button class="btn-option" onclick="toggleBtn('pickup', 'Ні')">Ні</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. Комунікації -->
  <div class="section">
    <div class="section-title">3. Комунікації</div>
    <div class="toggle-row-vert">
      <span>Електрика</span>
      <div class="btn-group" id="group-power">
        <button class="btn-option" onclick="toggleThreeBtn('power', 'Від мережі')">Від мережі</button>
        <button class="btn-option" onclick="toggleThreeBtn('power', 'Немає')">Немає</button>
        <button class="btn-option" onclick="toggleThreeBtn('power', 'Від генератора')">Генератор</button>
      </div>
    </div>
    <div class="toggle-row-vert">
      <span>Вода</span>
      <div class="btn-group" id="group-water">
        <button class="btn-option" onclick="toggleThreeBtn('water', 'Є')">Є</button>
        <button class="btn-option" onclick="toggleThreeBtn('water', 'Немає')">Немає</button>
        <button class="btn-option" onclick="toggleThreeBtn('water', 'Від бочки')">Від бочки</button>
      </div>
    </div>
  </div>

  <!-- 4. Коментар -->
  <div class="section">
    <input type="text" id="commentInput" class="comment-input" placeholder="Коментар (за потребою)..." />
  </div>

  <button class="submit-btn" onclick="sendData()">Зберегти та відправити</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    let RESTAURANTS = {};

    try {
      const rawData = urlParams.get('data');
      if (rawData) {
        const parsed = JSON.parse(decodeURIComponent(rawData));
        RESTAURANTS = parsed.r || {};
      }
    } catch(e) {}

    let currentState = {};

    function initDropdown() {
      const select = document.getElementById('restoSelect');
      select.innerHTML = '';
      for (const [code, info] of Object.entries(RESTAURANTS)) {
        const opt = document.createElement('option');
        opt.value = code;
        opt.innerText = `📍 ${info.n}`;
        select.appendChild(opt);
      }
      if (Object.keys(RESTAURANTS).length > 0) {
        onRestaurantChange();
      }
    }

    function makeClickablePhone(phone, name) {
      if (!phone || phone === "?") return name || '-';
      const cleanPhone = String(phone).replace(/\+/g, '').replace(/\s/g, '');
      const label = name ? `${name} (${phone})` : phone;
      return `<a href="tel:+${cleanPhone}">${label}</a>`;
    }

    function onRestaurantChange() {
      const code = document.getElementById('restoSelect').value;
      const info = RESTAURANTS[code] || {};

      document.getElementById('info-phone').innerHTML = makeClickablePhone(info.p, '');
      document.getElementById('info-director').innerHTML = makeClickablePhone(info.dp, info.d);
      document.getElementById('info-tk').innerHTML = makeClickablePhone(info.tp, info.t);

      currentState = {
        restaurantCode: code,
        restaurantName: info.n,
        phone: info.p,
        director: info.d,
        directorPhone: info.dp,
        tk: info.t,
        tkPhone: info.tp,
        mainStatus: 'Відчинені',
        hall: 'Працює',
        drive: 'Працює',
        delivery: 'Працює',
        pickup: 'Працює',
        power: 'Від мережі',
        water: 'Є',
        comment: ''
      };

      document.getElementById('commentInput').value = '';
      renderUI();
    }

    function renderUI() {
      selectMainStatus(currentState.mainStatus, false);
      toggleBtn('hall', currentState.hall);
      toggleBtn('drive', currentState.drive);
      toggleBtn('delivery', currentState.delivery);
      toggleBtn('pickup', currentState.pickup);
      toggleThreeBtn('power', currentState.power);
      toggleThreeBtn('water', currentState.water);
    }

    function selectMainStatus(val, autoUpdateChannels = true) {
      currentState.mainStatus = val;
      const group = document.querySelectorAll('#main-status-group .btn-option');
      group.forEach(b => b.className = 'btn-option');
      
      if(val === 'Відчинені') {
        document.getElementById('btn-main-open').className = 'btn-option active-green';
        if (autoUpdateChannels) {
          toggleBtn('hall', 'Працює');
          toggleBtn('drive', 'Працює');
          toggleBtn('delivery', 'Працює');
          toggleBtn('pickup', 'Працює');
        }
      } else if(val === 'Зачинені') {
        document.getElementById('btn-main-closed').className = 'btn-option active-red';
        if (autoUpdateChannels) {
          toggleBtn('hall', 'Ні');
          toggleBtn('drive', 'Ні');
          toggleBtn('delivery', 'Ні');
          toggleBtn('pickup', 'Ні');
        }
      } else if(val === 'Зачинені + в укритті') {
        document.getElementById('btn-main-shelter').className = 'btn-option active-orange';
        if (autoUpdateChannels) {
          toggleBtn('hall', 'Ні');
          toggleBtn('drive', 'Ні');
          toggleBtn('delivery', 'Ні');
          toggleBtn('pickup', 'Ні');
        }
      }
    }

    function toggleBtn(key, val) {
      currentState[key] = val;
      const group = document.querySelectorAll(`#group-${key} .btn-option`);
      group.forEach(b => {
        b.className = 'btn-option';
        const isYes = b.innerText.trim() === 'Так';
        if ((isYes && val === 'Працює') || (!isYes && val === 'Ні')) {
          b.className = (val === 'Працює') ? 'btn-option active-green' : 'btn-option active-red';
        }
      });
    }

    function toggleThreeBtn(key, val) {
      currentState[key] = val;
      const group = document.querySelectorAll(`#group-${key} .btn-option`);
      group.forEach(b => {
        b.className = 'btn-option';
        const text = b.innerText.trim();
        if ((text === 'Від мережі' && val === 'Від мережі') || (text === 'Є' && val === 'Є')) {
          b.className = 'btn-option active-green';
        } else if (text === 'Немає' && val === 'Немає') {
          b.className = 'btn-option active-red';
        } else if ((text === 'Генератор' && val === 'Від генератора') || (text === 'Від бочки' && val === 'Від бочки')) {
          b.className = 'btn-option active-blue';
        }
      });
    }

    function sendData() {
      currentState.comment = document.getElementById('commentInput').value.trim();
      tg.sendData(JSON.stringify(currentState));
    }

    initDropdown();
  </script>
</body>
</html>
